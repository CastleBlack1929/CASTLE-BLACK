  <style>
    /* ── HALLOWEEN DICE ─────────────────────── */
    .hw-dice {
      position: relative;
      width: 150px; height: 150px;
      margin: 0 auto;
      cursor: pointer;
      perspective: 600px;
    }
    .hw-face {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transform: rotateY(90deg);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.42s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
      will-change: transform, opacity;
    }
    .hw-face.hw-active {
      transform: rotateY(0deg);
      opacity: 1;
      pointer-events: auto;
    }
    .hw-face.hw-exit {
      transform: rotateY(-90deg) scale(0.85);
      opacity: 0;
    }
    .hw-emoji {
      font-size: 88px;
      line-height: 1;
      display: block;
      filter: drop-shadow(0 0 18px rgba(255,140,0,0.55));
    }
    @keyframes hwPop {
      0%   { transform: rotateY(0deg) scale(0.6); opacity: 0.6; }
      65%  { transform: rotateY(0deg) scale(1.18); }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .hw-face.hw-pop {
      animation: hwPop 0.38s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes hwShake {
      0%,100% { transform: rotate(0deg); }
      20%     { transform: rotate(-9deg) scale(1.05); }
      45%     { transform: rotate(9deg) scale(1.05); }
      65%     { transform: rotate(-5deg); }
      85%     { transform: rotate(5deg); }
    }
    .hw-dice.hw-shaking { animation: hwShake 0.32s ease; }
  </style>
  <link rel="icon" href="img/logo-black.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-black.png">
</head>
<body>
  <a class="back-btn" href="index.html">Inicio</a>

  <main class="login-hero login-hero--single">
    <section class="login-card">
      <div class="brand brand--solo">
        <div class="hw-dice" id="hwDice">
          <div class="hw-face hw-active" id="hwF0">
            <img src="img/logo-black.png" alt="Logo Castle Black" class="logo logo--xl">

          <div class="hw-face" id="hwF3"><span class="hw-emoji">💀</span></div>
        </div>
      </div>

      <form onsubmit="login(event)">
        <label class="field">

        <label class="field">

        <button type="submit">Entrar al panel</button>
      </form>

  <script>
  /* ── HALLOWEEN: BOO 👻 ──────────────────────────────── */
  (function () {
    const now = new Date();
    const y = now.getFullYear();
    if (now < new Date(y, 9, 1) || now >= new Date(y, 10, 2)) return;

    const style = document.createElement('style');
    style.textContent = `
      @keyframes booFlash {
        0%   { opacity: 0; }
        7%   { opacity: 0.9; }
        100% { opacity: 0; }
      }
      @keyframes booGhost {
        0%   { transform: translate(-50%,-62%) scale(0.15); opacity: 0; }
        11%  { transform: translate(-50%,-50%) scale(1.28); opacity: 1; }
        42%  { transform: translate(-50%,-50%) scale(1);    opacity: 1; }
        100% { transform: translate(-50%,-72%) scale(0.9);  opacity: 0; }
      }
      #booFlashEl.boo-run { animation: booFlash 0.75s ease-out forwards; }
      #booGhostEl.boo-run { animation: booGhost 2.1s cubic-bezier(0.22,1,0.36,1) forwards; }
    `;
    document.head.appendChild(style);

    const flashEl = document.createElement('div');
    flashEl.id = 'booFlashEl';
    Object.assign(flashEl.style, {
      position:'fixed', inset:'0', background:'#fff',
      opacity:'0', pointerEvents:'none', zIndex:'9998'
    });

    const ghostEl = document.createElement('div');
    ghostEl.id = 'booGhostEl';
    ghostEl.textContent = '👻';
    Object.assign(ghostEl.style, {
      position:'fixed', top:'50%', left:'50%',
      fontSize:'min(40vw, 230px)', lineHeight:'1',
      pointerEvents:'none', zIndex:'9999',
      opacity:'0', willChange:'transform, opacity',
      filter:'drop-shadow(0 0 48px rgba(200,255,200,0.5))'
    });

    document.body.appendChild(flashEl);
    document.body.appendChild(ghostEl);

    let seq = '', busy = false;
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      seq = (seq + e.key.toLowerCase()).slice(-3);
      if (seq === 'boo') { seq = ''; triggerBoo(); }
    });

    function triggerBoo() {
      if (busy) return;
      busy = true;
      playBooSound();
      [flashEl, ghostEl].forEach(el => {
        el.classList.remove('boo-run');
        void el.offsetWidth;
        el.classList.add('boo-run');
      });
      setTimeout(() => {
        flashEl.classList.remove('boo-run');
        ghostEl.classList.remove('boo-run');
        busy = false;
      }, 2300);
    }

    function playBooSound() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const t = ctx.currentTime;

        const bufLen = Math.floor(ctx.sampleRate * 2);
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const da = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) da[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const nG = ctx.createGain();
        noise.connect(nG); nG.connect(ctx.destination);
        nG.gain.setValueAtTime(0.36, t);
        nG.gain.exponentialRampToValueAtTime(0.001, t + 1.7);
        noise.start(t); noise.stop(t + 1.8);

        const scr = ctx.createOscillator();
        const sG  = ctx.createGain();
        scr.type = 'sawtooth';
        scr.frequency.setValueAtTime(900, t);
        scr.frequency.exponentialRampToValueAtTime(150, t + 1.4);
        sG.gain.setValueAtTime(0.28, t);
        sG.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
        scr.connect(sG); sG.connect(ctx.destination);
        scr.start(t); scr.stop(t + 1.7);

        const sub = ctx.createOscillator();
        const subG = ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(95, t);
        sub.frequency.exponentialRampToValueAtTime(28, t + 0.32);
        subG.gain.setValueAtTime(0.75, t);
        subG.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
        sub.connect(subG); subG.connect(ctx.destination);
        sub.start(t); sub.stop(t + 0.4);
      } catch(e) {}
    }
  })();
  </script>
  <script>
  /* ── HALLOWEEN DICE ─────────────────────────────── */
  (function () {
    const now = new Date();
    const y = now.getFullYear();
    if (now < new Date(y, 9, 1) || now >= new Date(y, 10, 2)) return; // oct 1 – nov 1
    const dice  = document.getElementById('hwDice');
    if (!dice) return;
    const faces = Array.from(dice.querySelectorAll('.hw-face'));
    let cur = 0, busy = false;

    function playSound(idx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const t   = ctx.currentTime;

        if (idx === 1) {
          /* 🎃 Risa espectral — tres "HA" entrecortados que bajan de tono */
          [0, 0.22, 0.44].forEach((d, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            const dist = ctx.createWaveShaper();
            const curve = new Float32Array(256);
            for (let k = 0; k < 256; k++) { const x = (k*2)/256-1; curve[k] = Math.sign(x)*Math.pow(Math.abs(x), 0.4); }
            dist.curve = curve;
            o.connect(dist); dist.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(240 - i*35, t+d);
            o.frequency.exponentialRampToValueAtTime(110 - i*20, t+d+0.17);
            g.gain.setValueAtTime(0, t+d);
            g.gain.linearRampToValueAtTime(0.22, t+d+0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t+d+0.18);
            o.start(t+d); o.stop(t+d+0.2);
          });

        } else if (idx === 2) {
          /* 🍬 Caja de música rota — notas disonantes con detune siniestro */
          const freqs = [1047, 932, 1175, 880]; // C6 Bb5 D6 A5 — modo frigio
          freqs.forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'triangle';
            o.frequency.value = f * (1 + (i % 2 === 0 ? 0.008 : -0.012));
            g.gain.setValueAtTime(0.13, t + i*0.14);
            g.gain.exponentialRampToValueAtTime(0.001, t + i*0.14 + 0.55);
            o.start(t + i*0.14); o.stop(t + i*0.14 + 0.6);
          });
          /* nota final chirriante */
          const sq = ctx.createOscillator();
          const sg = ctx.createGain();
          sq.connect(sg); sg.connect(ctx.destination);
          sq.type = 'square'; sq.frequency.value = 1800;
          sg.gain.setValueAtTime(0.04, t+0.62);
          sg.gain.exponentialRampToValueAtTime(0.001, t+0.82);
          sq.start(t+0.62); sq.stop(t+0.84);

        } else if (idx === 3) {
          /* 💀 DEMONIO — sub-bass + coro satánico + banshee con vibrato */
          // Golpe sub que se siente físico
          const sub = ctx.createOscillator();
          const subG = ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(85, t);
          sub.frequency.exponentialRampToValueAtTime(22, t+0.45);
          subG.gain.setValueAtTime(0.65, t);
          subG.gain.exponentialRampToValueAtTime(0.001, t+0.45);
          sub.connect(subG); subG.connect(ctx.destination);
          sub.start(t); sub.stop(t+0.46);
          // Coro demoníaco — 3 saws desafinados con saturación tanh
          [-6, 0, 8].forEach((dt, i) => {
            const o = ctx.createOscillator();
            const dist = ctx.createWaveShaper();
            const g = ctx.createGain();
            const cv = new Float32Array(512);
            for (let k=0; k<512; k++) { const x=(k*2)/512-1; cv[k]=Math.tanh(x*9)*0.85; }
            dist.curve = cv;
            o.type = 'sawtooth'; o.frequency.value = 72 + dt;
            o.connect(dist); dist.connect(g); g.connect(ctx.destination);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.14, t+0.06);
            g.gain.setValueAtTime(0.14, t+0.4);
            g.gain.exponentialRampToValueAtTime(0.001, t+0.85);
            o.start(t); o.stop(t+0.86);
          });
          // Banshee descendente con vibrato rápido
          const ban = ctx.createOscillator();
          const vib = ctx.createOscillator();
          const vibG = ctx.createGain();
          const banG = ctx.createGain();
          vib.frequency.value = 11; vibG.gain.value = 70;
          vib.connect(vibG); vibG.connect(ban.frequency);
          ban.type = 'sine';
          ban.frequency.setValueAtTime(2200, t+0.04);
          ban.frequency.exponentialRampToValueAtTime(420, t+0.75);
          banG.gain.setValueAtTime(0, t+0.04);
          banG.gain.linearRampToValueAtTime(0.2, t+0.1);
          banG.gain.exponentialRampToValueAtTime(0.001, t+0.8);
          ban.connect(banG); banG.connect(ctx.destination);
          vib.start(t+0.04); ban.start(t+0.04);
          ban.stop(t+0.82); vib.stop(t+0.82);

        } else {
          /* Logo — portal que se cierra, tono que sube y desaparece */
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(200, t);
          o.frequency.exponentialRampToValueAtTime(900, t+0.25);
          g.gain.setValueAtTime(0.1, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.28);
          o.start(t); o.stop(t+0.3);
        }
      } catch (e) {}
    }

    dice.addEventListener('click', () => {
      if (busy) return;
      busy = true;

      const prev = cur;
      cur = (cur + 1) % faces.length;

      /* shake */
      dice.classList.add('hw-shaking');
      setTimeout(() => dice.classList.remove('hw-shaking'), 320);

      /* exit */
      faces[prev].classList.remove('hw-active');
      faces[prev].classList.add('hw-exit');
      setTimeout(() => faces[prev].classList.remove('hw-exit'), 450);

      /* enter */
      setTimeout(() => {
        faces[cur].classList.add('hw-active', 'hw-pop');
        dice.dataset.face = cur;
        setTimeout(() => { faces[cur].classList.remove('hw-pop'); busy = false; }, 400);
      }, 160);

      playSound(cur);
    });
  })();
  </script>
  <script>
  /* ── HALLOWEEN: BAT 🦇 ──────────────────────────────── */
  (function () {
    const now = new Date();
    const y = now.getFullYear();
    if (now < new Date(y, 9, 1) || now >= new Date(y, 10, 2)) return;

    const style = document.createElement('style');
    style.textContent = `
      @keyframes batLTR {
        0%   { transform: translate(-90px, 0px); }
        12%  { transform: translate(12vw, -22px); }
        25%  { transform: translate(25vw,  10px); }
        38%  { transform: translate(38vw, -18px); }
        50%  { transform: translate(50vw,   8px); }
        63%  { transform: translate(63vw, -16px); }
        76%  { transform: translate(76vw,   7px); }
        88%  { transform: translate(88vw, -12px); }
        100% { transform: translate(calc(100vw + 90px), 0px); }
      }
      @keyframes batRTL {
        0%   { transform: translate(calc(100vw + 90px), 0px); }
        12%  { transform: translate(88vw, -22px); }
        25%  { transform: translate(75vw,  10px); }
        38%  { transform: translate(62vw, -18px); }
        50%  { transform: translate(50vw,   8px); }
        63%  { transform: translate(37vw, -16px); }
        76%  { transform: translate(24vw,   7px); }
        88%  { transform: translate(12vw, -12px); }
        100% { transform: translate(-90px, 0px); }
      }
    `;
    document.head.appendChild(style);

    const bat = document.createElement('div');
    bat.textContent = '🦇';
    Object.assign(bat.style, { position:'fixed', left:'0', opacity:'0',
      lineHeight:'1', pointerEvents:'none', zIndex:'9990' });
    document.body.appendChild(bat);

    function launch() {
      const ltr = Math.random() < 0.5;
      const top  = 6 + Math.random() * 38;
      const dur  = 5200 + Math.random() * 3800;
      const size = 26 + Math.floor(Math.random() * 14);
      bat.style.top       = top + 'vh';
      bat.style.fontSize  = size + 'px';
      bat.style.opacity   = '1';
      bat.style.animation = (ltr ? 'batLTR' : 'batRTL') + ' ' + dur + 'ms linear forwards';
      setTimeout(() => {
        bat.style.opacity   = '0';
        bat.style.animation = 'none';
        setTimeout(launch, 38000 + Math.random() * 42000);
      }, dur + 300);
    }

    setTimeout(launch, 7000 + Math.random() * 13000);
  })();
  </script>
